name: Qunxue delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: '0.11.29'
  UV_CONCURRENT_DOWNLOADS: '1'
  UV_CONCURRENT_INSTALLS: '1'
  UV_CONCURRENT_BUILDS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 deploy/release_scope.py "$BASE" "$(git rev-parse HEAD)" > scope.json
          for key in backend frontend; do echo "$key=$(python3 -c 'import json,sys; print(str(json.load(open("scope.json"))[sys.argv[1]]).lower())' "$key")" >> "$GITHUB_OUTPUT"; done

  deployment_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - name: Hash-pinned wheel build tooling
        run: python3 -m pip install --require-hashes --no-deps -r deploy/wheel-build-tools.lock
      - name: Deployment safety tests (synthetic only)
        run: python3 -m unittest discover -s deploy/tests -v

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frozen dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci --ignore-scripts
      - name: API contract
        run: make check-contract
      - name: Backend checks (one worker)
        run: make check-backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: frontend-cache
        with:
          path: frontend/dist
          key: qunxue-web-${{ runner.os }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/index.html', 'frontend/*.json', 'frontend/*.ts', 'frontend/*.js') }}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Frontend checks (one worker)
        working-directory: frontend
        run: |
          npm run check:boundaries
          npm run lint
          npm run test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run build
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: frontend

  checks:
    name: Required checks
    needs: [changes, deployment_tests, backend, frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(v["result"] in ("success","skipped") for v in json.loads(os.environ["RESULTS"]).values())'

  deploy:
    name: Deploy production
    needs: checks
    if: always() && needs.checks.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Only production is serialized. A running stop/switch is never cancelled.
    concurrency:
      group: qunxue-production
      cancel-in-progress: false
    env:
      PRODUCTION_CONFIGURED: ${{ vars.PRODUCTION_CONFIGURED }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read verified live baseline before any business build
        run: |
          python3 deploy/send_release.py --status baseline.json
          base=$(python3 -c 'import json; print(json.load(open("baseline.json"))["revision"])')
          python3 deploy/release_scope.py "$base" "$RELEASE_REVISION" > scope.json
          for key in backend frontend dependencies; do echo "$key=$(python3 -c 'import json,sys; print(str(json.load(open("scope.json"))[sys.argv[1]]).lower())' "$key")" >> "$GITHUB_ENV"; done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: frontend-cache
        with:
          path: frontend/dist
          key: qunxue-web-${{ runner.os }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/index.html', 'frontend/*.json', 'frontend/*.ts', 'frontend/*.js') }}
      - name: Build affected frontend only
        if: env.frontend == 'true' && steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: env.dependencies == 'true'
        id: wheel-cache
        with:
          path: release
          key: qunxue-wheels-v1-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'deploy/wheel-build-tools.lock', 'deploy/build_wheelhouse.py') }}
      - name: Build changed locked offline wheels
        if: env.dependencies == 'true' && steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --require-hashes --no-deps -r deploy/wheel-build-tools.lock
          mkdir -p release
          cd backend
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file ../release/source-requirements.lock
          cd ..
          python3 deploy/build_wheelhouse.py --source-requirements release/source-requirements.lock --wheelhouse release/wheelhouse --output release/requirements.lock --provenance release/wheel-build-provenance.json
      - name: Package exact delta against actual live baseline
        id: package
        run: >-
          python3 deploy/build_release.py --revision "$RELEASE_REVISION" --baseline baseline.json
          --wheelhouse release/wheelhouse --requirements release/requirements.lock
          --output artifact/qunxue-release.tar.gz
      - name: Save immutable release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qunxue-${{ github.sha }}-${{ github.run_attempt }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deploy through fixed app-scoped receiver
        env:
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: python3 deploy/send_release.py
