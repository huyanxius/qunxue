name: Qunxue delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: '0.11.29'
  UV_CONCURRENT_DOWNLOADS: '1'
  UV_CONCURRENT_INSTALLS: '1'
  UV_CONCURRENT_BUILDS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            python3 deploy/validate_release.py
            # Check the exact published commit, without building unchanged assets.
            printf '{"backend": true, "frontend": true, "dependencies": false}\n' > scope.json
          else
            python3 deploy/release_scope.py "$BASE" "$(git rev-parse HEAD)" > scope.json
          fi
          for key in backend frontend dependencies; do echo "$key=$(python3 -c 'import json,sys; print(str(json.load(open("scope.json"))[sys.argv[1]]).lower())' "$key")" >> "$GITHUB_OUTPUT"; done

  deployment_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - name: Hash-pinned wheel build tooling
        run: python3 -m pip install --require-hashes --no-deps -r deploy/wheel-build-tools.lock
      - name: Deployment safety tests (synthetic only)
        run: python3 -m unittest discover -s deploy/tests -v

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frozen dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci --ignore-scripts
      - name: API contract
        run: make check-contract
      - name: Backend checks (one worker)
        run: make check-backend
      # Default-branch caches can be restored by all Release tags; tag caches
      # cannot be restored by a different tag. This is a check, never a deploy.
      - name: Cache checked offline dependency closure on main
        if: github.event_name == 'push' && needs.changes.outputs.dependencies == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: wheel-cache
        with:
          path: release
          key: qunxue-wheels-v2-cpython312-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'deploy/wheel-build-tools.lock', 'deploy/build_wheelhouse.py') }}
      - name: Verify changed locked offline wheels for future Releases
        if: github.event_name == 'push' && needs.changes.outputs.dependencies == 'true' && steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --require-hashes --no-deps -r deploy/wheel-build-tools.lock
          mkdir -p release
          cd backend
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file ../release/source-requirements.lock
          cd ..
          python3 deploy/build_wheelhouse.py --source-requirements release/source-requirements.lock --wheelhouse release/wheelhouse --output release/requirements.lock --provenance release/wheel-build-provenance.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name != 'release'
        id: frontend-cache
        with:
          path: frontend/dist
          key: qunxue-web-v2-node22-${{ runner.os }}-${{ hashFiles('frontend/**', '!frontend/dist/**', '!frontend/node_modules/**', '!frontend/docs/**', '!frontend/README.md', '!frontend/AGENTS.md', '!frontend/VERCEL_PREVIEW.md', '!frontend/vercel.json') }}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Frontend checks (one worker)
        working-directory: frontend
        run: |
          npm run check:boundaries
          npm run lint
          npm run typecheck
          npm run test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run build
        if: github.event_name != 'release' && steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: frontend

  checks:
    name: Required checks
    needs: [changes, deployment_tests, backend, frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(v["result"] in ("success","skipped") for v in json.loads(os.environ["RESULTS"]).values())'

  deploy:
    name: Deploy production
    needs: checks
    if: always() && needs.checks.result == 'success' && github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Only production is serialized. A running stop/switch is never cancelled.
    concurrency:
      group: qunxue-production
      cancel-in-progress: false
    env:
      PRODUCTION_CONFIGURED: ${{ vars.PRODUCTION_CONFIGURED }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck the exact published tag before production access
        run: python3 deploy/validate_release.py
      - name: Read verified live baseline before any business build
        run: |
          python3 deploy/send_release.py --status baseline.json
          base=$(python3 -c 'import json; print(json.load(open("baseline.json"))["revision"])')
          python3 deploy/release_scope.py "$base" "$RELEASE_REVISION" --baseline baseline.json > scope.json
          for key in backend frontend dependencies; do echo "$key=$(python3 -c 'import json,sys; print(str(json.load(open("scope.json"))[sys.argv[1]]).lower())' "$key")" >> "$GITHUB_ENV"; done
      - if: env.dependencies == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - if: env.dependencies == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: env.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: env.frontend == 'true'
        id: frontend-cache
        with:
          path: frontend/dist
          key: qunxue-web-v2-node22-${{ runner.os }}-${{ hashFiles('frontend/**', '!frontend/dist/**', '!frontend/node_modules/**', '!frontend/docs/**', '!frontend/README.md', '!frontend/AGENTS.md', '!frontend/VERCEL_PREVIEW.md', '!frontend/vercel.json') }}
      - name: Build affected frontend only
        if: env.frontend == 'true' && steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: env.dependencies == 'true'
        id: wheel-cache
        with:
          path: release
          key: qunxue-wheels-v2-cpython312-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'deploy/wheel-build-tools.lock', 'deploy/build_wheelhouse.py') }}
      - name: Build changed locked offline wheels
        if: env.dependencies == 'true' && steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --require-hashes --no-deps -r deploy/wheel-build-tools.lock
          mkdir -p release
          cd backend
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file ../release/source-requirements.lock
          cd ..
          python3 deploy/build_wheelhouse.py --source-requirements release/source-requirements.lock --wheelhouse release/wheelhouse --output release/requirements.lock --provenance release/wheel-build-provenance.json
      - name: Package exact delta against actual live baseline
        id: package
        run: >-
          python3 deploy/build_release.py --revision "$RELEASE_REVISION" --baseline baseline.json
          --wheelhouse release/wheelhouse --requirements release/requirements.lock
          --output artifact/qunxue-release.tar.gz
      - name: Save immutable release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qunxue-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deploy through fixed app-scoped receiver
        env:
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: python3 deploy/send_release.py
      - name: Confirm recorded production revision matches the published Release
        run: python3 deploy/send_release.py --status deployed.json --expect-revision "$RELEASE_REVISION"
      - name: Record verified release result
        run: |
          printf 'Verified production revision: `%s`\n\n' "$RELEASE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Delta package bytes: %s\n' "$(wc -c < artifact/qunxue-release.tar.gz)" >> "$GITHUB_STEP_SUMMARY"
