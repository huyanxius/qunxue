name: Qunxue delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a main release while it is stopping writers or switching code.
concurrency:
  group: qunxue-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: '0.11.29'
  UV_CONCURRENT_DOWNLOADS: '1'
  UV_CONCURRENT_INSTALLS: '1'
  UV_CONCURRENT_BUILDS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Deployment safety tests (synthetic only)
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Frozen dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci --ignore-scripts
      - name: API contract
        run: make check-contract
      - name: Backend checks (one worker)
        run: make check-backend
      - name: Frontend checks (one worker)
        working-directory: frontend
        run: |
          npm run check:boundaries
          npm run lint
          npm run test -- --maxWorkers=1 --no-file-parallelism
          npm run build
      - name: Export locked binary dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release/wheelhouse
          cd backend
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file ../release/requirements.lock
          cd ..
          python3 -m pip download --only-binary=:all: --require-hashes --dest release/wheelhouse -r release/requirements.lock
      - name: Package exact checked commit
        id: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: >-
          python3 deploy/build_release.py --revision "$RELEASE_REVISION"
          --wheelhouse release/wheelhouse --requirements release/requirements.lock
          --output release/qunxue-release.tar.gz
      - name: Save immutable release
        id: artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qunxue-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/qunxue-release.tar.gz
            release/qunxue-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}

  deploy:
    name: Deploy production
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    concurrency:
      group: qunxue-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact_id }}
          path: artifact
          merge-multiple: true
      - name: Deploy through fixed app-scoped receiver
        env:
          PRODUCTION_CONFIGURED: ${{ vars.PRODUCTION_CONFIGURED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_SHA256: ${{ needs.checks.outputs.sha256 }}
        run: python3 deploy/send_release.py
