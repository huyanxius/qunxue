[project]
name = "qunxue-api"
version = "0.1.0"
description = "群学致知 Demo application API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "bibtexparser>=1.4.4,<2.0",
    "fastapi>=0.140.7",
    "markdown-it-py>=4.0.0",
    "pydantic-ai-slim[openai]>=1.0,<2.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "resend>=2.0",
    "rispy>=0.10.0,<1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
qunxue-api = "qunxue_api.main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
